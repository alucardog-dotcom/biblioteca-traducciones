# La web (GitHub Pages): se genera con tools/web.py a partir del catálogo y se publica cada vez que cambia
# en main el catálogo, las portadas a mano, las capturas, la versión o la propia web, y además una vez al día
# para poner al día «Lo más visto» (las visitas de GoatCounter de los últimos 30 días).
name: Web

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/recursos/catalogo/**'
      - 'src-tauri/tauri.conf.json'
      - 'ui/portadas/**'
      - 'ui/icono.svg'
      - 'ui/app.js'
      - 'docs/**'
      - 'web/**'
      - 'tools/web.py'
      - '.github/workflows/web.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Todo el historial: las novedades de la portada salen de los commits del catálogo (fechas_alta en tools/web.py).
          fetch-depth: 0
      # GOATCOUNTER_TOKEN: clave de GoatCounter de solo lectura de estadísticas (secreto del repositorio). Sin ella la
      # web sale igual, sin la selección «Lo más visto».
      - name: Generar la web
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 tools/web.py _site
      # IndexNow (Bing, DuckDuckGo, Ecosia, Yandex…): antes de subir la web se pone la clave en su raíz y se guarda el
      # sitemap publicado; después de desplegar, tools/indexnow.py avisa solo de las páginas nuevas o cambiadas. Si
      # falla, la web se publica igual.
      - name: Preparar IndexNow
        continue-on-error: true
        run: python3 tools/indexnow.py --preparar "$RUNNER_TEMP/sitemap-anterior.xml" _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: publicar
        uses: actions/deploy-pages@v4
        with:
          # Son 5.400 páginas y las miniaturas: a GitHub Pages le cuesta a veces más de los 10 minutos por defecto.
          timeout: 1800000
      - name: Avisar a IndexNow
        continue-on-error: true
        timeout-minutes: 5
        run: python3 tools/indexnow.py --anterior "$RUNNER_TEMP/sitemap-anterior.xml" _site
