# Al publicar una etiqueta v* (v0.5.0, por ejemplo): pasa las pruebas, compila el instalador, lo firma con el
# certificado de SignPath Foundation (solo si el repositorio tiene las variables SIGNPATH_*, ver DESARROLLO.md)
# y lo sube a la versión de GitHub con ese nombre (la crea si no existe).
name: Publicar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# «actions: read» deja que SignPath descargue del flujo el instalador sin firmar.
permissions:
  contents: write
  actions: read

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Pruebas
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: Compilar el instalador
        run: npm run build
      - name: Versión
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      # SignPath solo firma lo que se guarda como artefacto del flujo, compilado en máquinas de GitHub.
      - name: Guardar el instalador sin firmar
        id: sin-firmar
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          archive: false
          if-no-files-found: error
      # Alguien del proyecto tiene que aprobar la petición en signpath.io antes de media hora.
      - name: Firmar el instalador (SignPath Foundation)
        if: startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          skip-decompress: true
          output-artifact-directory: firmado
      - name: Subir el instalador a la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          carpeta=src-tauri/target/release/bundle/nsis
          if [ -d firmado ]; then carpeta=firmado; fi
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$carpeta"/*-setup.exe --clobber
          # El mismo instalador con nombre fijo, para el botón de descarga directa de la web (releases/latest/download/…).
          cp "$carpeta"/*-setup.exe Biblioteca-de-traducciones-setup.exe
          gh release upload "$GITHUB_REF_NAME" Biblioteca-de-traducciones-setup.exe --clobber
