# Al publicar una etiqueta v* (v0.5.0, por ejemplo): pasa las pruebas, compila el instalador y lo sube a
# la versión de GitHub con ese nombre (la crea si no existe).
name: Publicar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Pruebas
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: Compilar el instalador
        run: npm run build
      - name: Subir el instalador a la versión
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*-setup.exe --clobber
